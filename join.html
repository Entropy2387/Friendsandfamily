<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create My Profile</title><link rel="stylesheet" href="styles.css"></head>
<body class="profile-page"><main class="shell narrow"><a class="back" href="./">← Home</a><section class="hero compact"><div><p class="eyebrow">WELCOME</p><h1>Create your profile <span class="heart">♡</span></h1><p class="lead">Add the little details that help us stay in touch and remember your favourite things.</p></div></section>
<section class="card"><div id="joinStatus" class="status">Checking your invitation…</div><form id="joinForm" hidden><div class="grid two"><label>Name<input id="j_name" required></label><label>Birthday<input id="j_birthday" type="date"></label></div><label>Address<textarea id="j_address" rows="3"></textarea></label><div class="grid two"><label>Phone<input id="j_phone" inputmode="tel" autocomplete="tel"></label><label>Email<input id="j_email" type="email" autocomplete="email"></label></div><div class="grid two"><label>Favourite flower<input id="j_favourite_flower"></label><label>Favourite treat<input id="j_favourite_treat" placeholder="Chocolate, sweets, cake…"></label></div><label>Favourite drink<input id="j_favourite_drink" placeholder="Alcoholic or non-alcoholic"></label><label>Hobbies<textarea id="j_hobbies" rows="3"></textarea></label><label>Likes<textarea id="j_likes" rows="3"></textarea></label><label>Dislikes<textarea id="j_dislikes" rows="3"></textarea></label><button type="submit">Create my profile ♡</button></form><div id="created" hidden class="created-box"><h2>Profile created! <span class="heart">♡</span></h2><p>Save this private link so you can update your details later:</p><input id="newEditLink" readonly><button id="copyLink" type="button">Copy my private link</button></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="join.js"></script></body></html>
