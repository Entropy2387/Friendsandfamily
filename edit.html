<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit My Details</title><link rel="stylesheet" href="styles.css"></head>
<body class="profile-page"><main class="shell narrow"><a class="back" href="./">← Home</a><section class="hero compact"><div><p class="eyebrow">YOUR PRIVATE PROFILE</p><h1 id="pageTitle">Edit your details</h1><p class="lead">Update anything that has changed or fill in the blanks.</p></div></section>
<section class="card"><div id="status" class="status">Loading your profile…</div><form id="profileForm" hidden><div class="grid two"><label>Name<input id="name" disabled></label><label>Birthday<input id="birthday" type="date" disabled></label></div><label>Address<textarea id="address" rows="3"></textarea></label><div class="grid two"><label>Phone<input id="phone" inputmode="tel" autocomplete="tel"></label><label>Email<input id="email" type="email" autocomplete="email"></label></div><div class="grid two"><label>Favourite flower<input id="favourite_flower"></label><label>Favourite treat<input id="favourite_treat" placeholder="Chocolate, sweets, cake…"></label></div><label>Favourite drink<input id="favourite_drink" placeholder="Alcoholic or non-alcoholic"></label><label>Hobbies<textarea id="hobbies" rows="3"></textarea></label><label>Likes<textarea id="likes" rows="3"></textarea></label><label>Dislikes<textarea id="dislikes" rows="3"></textarea></label><button type="submit">Save changes</button></form></section>
<section class="card family-profile-card" id="familySection" hidden><p class="eyebrow">FAMILY CONNECTIONS</p><h2 id="householdName">Your family</h2><p id="householdMembers" class="family-copy"></p><div id="relationshipsWrap" hidden><h3>Relationships</h3><div id="relationshipChips" class="relationship-list"></div></div><div id="anniversariesWrap" hidden><h3>Anniversaries</h3><div id="anniversaryList" class="anniversary-list"></div></div><p class="privacy-mini">Family connections are linked in the directory; household addresses stay private.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
